[package]
name = "lens-speech"
version = "0.12.18"
edition = "2024"
description = "Sirv Lens transcription: whisper.cpp in its own process, so the daemon stays small and safe"

[[bin]]
name = "lens-speech"
path = "src/main.rs"

[features]
# GPU builds: Vulkan (NVIDIA, AMD, Intel on Linux and Windows) and Metal (macOS).
vulkan = ["whisper-rs-sys/vulkan"]
metal = ["whisper-rs-sys/metal"]

[dependencies]
hound = "3.5.1"
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
whisper-rs = "0.16.0"
whisper-rs-sys = "0.15.0"
