name: Debug Windows install
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  install:
    runs-on: windows-2025
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installers-windows-2025
          run-id: 43723122627
          github-token: ${{ github.token }}
          path: setup
      - name: Silent install, check, silent uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem setup\*.exe | Select-Object -First 1
          Write-Output "installer: $($setup.Name)"
          $p = Start-Process $setup.FullName -ArgumentList '/S' -Wait -PassThru
          Write-Output "install exit: $($p.ExitCode)"
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall'
          $entries = Get-ChildItem $key -ErrorAction SilentlyContinue | ForEach-Object { Get-ItemProperty $_.PSPath } | Where-Object { $_.DisplayName -match 'lens' }
          $entries | Format-List PSChildName, DisplayName, DisplayVersion, Publisher, InstallLocation, UninstallString, QuietUninstallString | Out-String | Write-Output
          $dir = $entries[0].InstallLocation.Trim('"')
          Write-Output "files in ${dir}:"; Get-ChildItem $dir -Recurse -Depth 1 | Select-Object -ExpandProperty FullName | Write-Output
          Write-Output "start menu:"; Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter *.lnk | Where-Object { $_.Name -match 'lens' } | Select-Object -ExpandProperty FullName | Write-Output
          & (Join-Path $dir 'lens.exe') version
          Get-Process lens*, lensw* -ErrorAction SilentlyContinue | Stop-Process -Force
          $u = $entries[0].UninstallString.Trim('"')
          $p = Start-Process $u -ArgumentList '/S' -Wait -PassThru
          Start-Sleep 5
          Write-Output "uninstall exit: $($p.ExitCode); folder left: $(Test-Path $dir); entry left: $((Get-ChildItem $key | ForEach-Object { Get-ItemProperty $_.PSPath } | Where-Object { $_.DisplayName -match 'lens' }).Count)"
