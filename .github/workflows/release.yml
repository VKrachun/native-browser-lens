name: Release

# A v* tag builds every target natively, the extension for both stores, and a draft GitHub
# release with SHA256SUMS. A person reviews the draft and publishes it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Third-party actions are pinned to a commit; the comment records the tag. Move both together.
jobs:
  binary:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # Secrets are not allowed in `if`; this flag is.
      CAN_SIGN_APPLE: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl: one static binary for every Linux distribution, no glibc floor. The speech
          # programs are C++ (whisper.cpp) and link glibc; without them Lens still runs, only
          # voice notes wait. gpu: the backend of lens-speech-gpu, none where it does not pay.
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl, speech: x86_64-unknown-linux-gnu, gpu: vulkan }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, speech: aarch64-unknown-linux-gnu, gpu: vulkan }
          - { os: macos-15, target: aarch64-apple-darwin, speech: aarch64-apple-darwin, gpu: metal }
          - { os: macos-15-intel, target: x86_64-apple-darwin, speech: x86_64-apple-darwin, gpu: "" }
          # whisper.cpp's Vulkan backend does not configure with the runner's Visual Studio yet: CPU speech.
          - { os: windows-2025, target: x86_64-pc-windows-msvc, speech: x86_64-pc-windows-msvc, gpu: "" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - name: libclang for bindgen (Windows)
        # .cargo/config.toml makes whisper-rs-sys use its bundled bindings, made on Linux, so
        # building needs no libclang. Their struct sizes are wrong on Windows (long is 32 bits
        # there): Windows generates its own with the runner's LLVM.
        if: runner.os == 'Windows'
        shell: bash
        run: |
          test -f "/c/Program Files/LLVM/bin/libclang.dll"
          echo 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"
          sed -i '/WHISPER_DONT_GENERATE_BINDINGS/d' .cargo/config.toml
          cargo clean -p whisper-rs-sys
      - name: musl C toolchain (bundled SQLite)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Vulkan headers and shader compiler (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends libvulkan-dev glslc
      - name: Vulkan SDK (Windows)
        if: runner.os == 'Windows' && matrix.gpu == 'vulkan'
        uses: jakoch/install-vulkan-sdk-action@7fe84289ddbf750f7eff9f8e4588e600e1dd06c8 # v1.8.1
        with:
          cache: true

      - name: Speech programs
        shell: bash
        run: |
          rustup target add ${{ matrix.speech }}
          cargo build --release --locked -p lens-speech --target ${{ matrix.speech }}
          if [[ -n "${{ matrix.gpu }}" ]]; then
            cargo build --release --locked -p lens-speech --features ${{ matrix.gpu }} \
              --target ${{ matrix.speech }} --target-dir target-gpu
          fi
          ext=""; [[ "$RUNNER_OS" == "Windows" ]] && ext=.exe
          mkdir -p speech-bin
          cp "target/${{ matrix.speech }}/release/lens-speech$ext" "speech-bin/lens-speech$ext"
          if [[ -n "${{ matrix.gpu }}" ]]; then
            cp "target-gpu/${{ matrix.speech }}/release/lens-speech$ext" "speech-bin/lens-speech-gpu$ext"
          fi
          # Without arguments it prints its usage and fails: proof that it starts.
          out=$("speech-bin/lens-speech$ext" 2>&1 || true)
          [[ "$out" == *usage* ]]

      - name: Smoke test
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/lens
          [[ "$RUNNER_OS" == "Windows" ]] && bin="$bin.exe"
          "$bin" version
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            # Static: no dynamic section means no glibc or library dependency.
            ! readelf -d "$bin" | grep -q NEEDED
          fi

      # Signing runs only where the publisher's secrets exist; nothing pretends otherwise.
      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS' && env.CAN_SIGN_APPLE == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # Notarization with the App Store Connect API key, as the installers do.
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "" "$keychain"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$keychain"
          bin=target/${{ matrix.target }}/release/lens
          mkdir -p "$RUNNER_TEMP/notarize"
          for program in "$bin" speech-bin/*; do
            codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$program"
            cp "$program" "$RUNNER_TEMP/notarize/"
          done
          ditto -c -k "$RUNNER_TEMP/notarize" "$RUNNER_TEMP/notarize.zip"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Package
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          name="sirv-lens-$version-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp README.md "dist/$name/"
          cp speech-bin/* "dist/$name/"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp target/${{ matrix.target }}/release/lens.exe target/${{ matrix.target }}/release/lensw.exe "dist/$name/"
            (cd dist && 7z a -tzip "$name.zip" "$name" >/dev/null)
          else
            cp target/${{ matrix.target }}/release/lens "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          fi
          rm -rf "dist/$name"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # Friendly installers, one build per platform: Sirv Lens.app in a DMG, a per-user setup program,
  # and an AppImage, a .deb and an Arch package. Each runs the first run when opened (lens open).
  installers:
    name: installers ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CAN_SIGN_APPLE: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, formats: "app,dmg", gpu: metal }
          - { os: macos-15-intel, formats: "app,dmg", gpu: "" }
          - { os: windows-2025, formats: nsis, gpu: "" }
          - { os: ubuntu-24.04, formats: "appimage,deb,pacman", gpu: vulkan }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: extension/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml
      - name: Rust toolchain
        shell: bash
        run: rustup toolchain install
      - name: libclang for bindgen (Windows)
        # .cargo/config.toml makes whisper-rs-sys use its bundled bindings, made on Linux, so
        # building needs no libclang. Their struct sizes are wrong on Windows (long is 32 bits
        # there): Windows generates its own with the runner's LLVM.
        if: runner.os == 'Windows'
        shell: bash
        run: |
          test -f "/c/Program Files/LLVM/bin/libclang.dll"
          echo 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"
          sed -i '/WHISPER_DONT_GENERATE_BINDINGS/d' .cargo/config.toml
          cargo clean -p whisper-rs-sys
      - name: Tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvulkan-dev glslc libfuse2 file
      - name: Tools (Windows)
        if: runner.os == 'Windows'
        run: choco install nsis -y --no-progress
      - name: Vulkan SDK (Windows)
        if: runner.os == 'Windows' && matrix.gpu == 'vulkan'
        uses: jakoch/install-vulkan-sdk-action@7fe84289ddbf750f7eff9f8e4588e600e1dd06c8 # v1.8.1
        with:
          cache: true
      - name: Packager
        run: cargo install cargo-packager --version 0.11.8 --locked
      - name: Extension dependencies
        working-directory: extension
        run: pnpm install --frozen-lockfile
      - name: Signing keychain (macOS)
        if: runner.os == 'macOS' && env.CAN_SIGN_APPLE == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "" "$keychain"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$keychain"
      - name: Build the installers
        shell: bash
        env:
          # Signing, and notarization of the app and the DMG with an App Store Connect API key.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [[ "$RUNNER_OS" == "macOS" && -n "$APPLE_API_KEY_P8" ]]; then
            export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
            printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH"
          fi
          unset APPLE_API_KEY_P8
          gpu=(); [[ -n "${{ matrix.gpu }}" ]] && gpu=(--gpu "${{ matrix.gpu }}")
          node scripts/package.mjs --formats "${{ matrix.formats }}" "${gpu[@]}"
          rm -f "$RUNNER_TEMP/AuthKey.p8"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*-setup.exe
            dist/*.AppImage
            dist/*.deb
            dist/*-pacman.tar.gz
          if-no-files-found: error

  extension:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: extension/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml
      - name: Store packages (Chrome, and Firefox with its source archive for AMO review)
        working-directory: extension
        run: |
          pnpm install --frozen-lockfile
          pnpm compile
          pnpm test
          pnpm zip
          pnpm zip:firefox
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension
          path: extension/.output/*.zip
          # .output starts with a dot, and upload-artifact skips hidden folders unless told.
          include-hidden-files: true
          if-no-files-found: error

  publish:
    needs: [binary, installers, extension]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The tag matches both version numbers
        run: |
          crate="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          extension="v$(jq -r .version extension/package.json)"
          test "$crate" = "$GITHUB_REF_NAME" && test "$extension" = "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true
      - name: Installers and checksums
        run: |
          cp scripts/install.sh scripts/install.ps1 release/
          cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Signed update manifest
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        working-directory: release
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign
          version="${GITHUB_REF_NAME#v}"
          python3 - "$version" <<'PY'
          import json, re, sys
          version = sys.argv[1]
          sums = dict(reversed(line.split(maxsplit=1)) for line in open("SHA256SUMS").read().splitlines())
          sums = {name.lstrip("*"): digest for name, digest in sums.items()}
          assets = {}
          for name, digest in sums.items():
              found = re.fullmatch(rf"sirv-lens-{re.escape(version)}-(.+)\.(tar\.gz|zip)", name)
              if found:
                  assets[found.group(1)] = {"file": name, "sha256": digest}
          extension = f"sirv-lens-extension-{version}-chrome.zip"
          manifest = {"version": version, "assets": assets,
                      "extension": {"file": extension, "sha256": sums[extension]} if extension in sums else None}
          assert len(assets) == 5, f"expected five platform archives, found {sorted(assets)}"
          json.dump(manifest, open("latest.json", "w"), indent=2)
          PY
          key="$RUNNER_TEMP/minisign.key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          minisign -S -s "$key" -m latest.json -t "Sirv Lens $version"
          rm -f "$key"
          minisign -V -P RWRUIk1sA/LfACfTQLljdyJArqZHzXbSZB32dsXEr2AMUrXAmSXevoDr -m latest.json
          sha256sum latest.json latest.json.minisig >> SHA256SUMS
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes release/*
