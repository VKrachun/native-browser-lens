name: Release

# A v* tag builds the Chrome and Firefox store extension packages (plus Firefox AMO sources)
# and publishes a GitHub Release with SHA256SUMS.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every version number matches (and the tag, on a release)
        run: |
          versions=$(
            jq -r .version extension/package.json plugin/.claude-plugin/plugin.json plugin/.codex-plugin/plugin.json
          )
          echo "$versions"
          test "$(echo "$versions" | sort -u | wc -l)" = 1
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then test "v$(echo "$versions" | head -1)" = "$GITHUB_REF_NAME"; fi

  extension:
    needs: versions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: extension/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml
      - name: Store packages (Chrome, and Firefox with its source archive for AMO review)
        working-directory: extension
        env:
          LENS_STORE: "1"
        run: |
          pnpm install --frozen-lockfile
          pnpm compile
          pnpm test
          pnpm zip
          pnpm zip:firefox
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension
          path: extension/.output/sirv-lens-extension-*.zip
          include-hidden-files: true
          if-no-files-found: error

  publish:
    needs: [extension]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: The tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        run: |
          cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --latest --verify-tag --generate-notes release/*
