name: Release

# A v* tag builds every target natively, the extension for both stores, and publishes a GitHub
# release with SHA256SUMS and the signed update feed (latest.json) that installed copies read.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Third-party actions are pinned to a commit; the comment records the tag. Move both together.
jobs:
  # First, so a forgotten version number fails before the long builds.
  versions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every version number matches (and the tag, on a release)
        run: |
          versions=$(
            sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1
            sed -n 's/^version = "\(.*\)"/\1/p' speech/Cargo.toml | head -1
            jq -r .version extension/package.json plugin/.claude-plugin/plugin.json plugin/.codex-plugin/plugin.json
          )
          echo "$versions"
          test "$(echo "$versions" | sort -u | wc -l)" = 1
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then test "v$(echo "$versions" | head -1)" = "$GITHUB_REF_NAME"; fi

  binary:
    name: ${{ matrix.target }}
    needs: versions
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # Secrets are not allowed in `if`; this flag is.
      CAN_SIGN_APPLE: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl: one static binary for every Linux distribution, no glibc floor. The speech
          # programs are C++ (whisper.cpp) and link glibc: built on Ubuntu 22.04 in Docker, they
          # need glibc 2.34 at most; without them Lens still runs, only voice notes wait.
          # gpu: the backend of lens-speech-gpu, none where it does not pay.
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl, speech: x86_64-unknown-linux-gnu, gpu: vulkan }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, speech: aarch64-unknown-linux-gnu, gpu: vulkan }
          - { os: macos-15, target: aarch64-apple-darwin, speech: aarch64-apple-darwin, gpu: metal }
          - { os: macos-15-intel, target: x86_64-apple-darwin, speech: x86_64-apple-darwin, gpu: "" }
          # whisper.cpp's Vulkan backend does not configure with the runner's Visual Studio yet: CPU speech.
          - { os: windows-2025, target: x86_64-pc-windows-msvc, speech: x86_64-pc-windows-msvc, gpu: "" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      # target-gpu holds the GPU build of lens-speech (Speech programs).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
          workspaces: |
            . -> target
            . -> target-gpu
      - name: libclang for bindgen (Windows)
        # .cargo/config.toml makes whisper-rs-sys use its bundled bindings, made on Linux, so
        # building needs no libclang. Their struct sizes are wrong on Windows (long is 32 bits
        # there): Windows generates its own with the runner's LLVM.
        if: runner.os == 'Windows'
        shell: bash
        run: |
          test -f "/c/Program Files/LLVM/bin/libclang.dll"
          echo 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"
          sed -i '/WHISPER_DONT_GENERATE_BINDINGS/d' .cargo/config.toml
          cargo clean -p whisper-rs-sys
      - name: musl C toolchain (bundled SQLite)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Vulkan SDK (Windows)
        if: runner.os == 'Windows' && matrix.gpu == 'vulkan'
        uses: jakoch/install-vulkan-sdk-action@7fe84289ddbf750f7eff9f8e4588e600e1dd06c8 # v1.8.1
        with:
          cache: true

      - name: Speech programs
        shell: bash
        run: |
          ext=""; [[ "$RUNNER_OS" == "Windows" ]] && ext=.exe
          mkdir -p speech-bin
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            docker run --rm -v "$PWD:/src" -w /src ubuntu:22.04 sh scripts/speech-linux.sh speech-bin ${{ matrix.gpu }}
            sh scripts/glibc-floor.sh 2.34 speech-bin
          else
            rustup target add ${{ matrix.speech }}
            cargo build --release --locked -p lens-speech --target ${{ matrix.speech }}
            if [[ -n "${{ matrix.gpu }}" ]]; then
              cargo build --release --locked -p lens-speech --features ${{ matrix.gpu }} \
                --target ${{ matrix.speech }} --target-dir target-gpu
            fi
            cp "target/${{ matrix.speech }}/release/lens-speech$ext" "speech-bin/lens-speech$ext"
            if [[ -n "${{ matrix.gpu }}" ]]; then
              cp "target-gpu/${{ matrix.speech }}/release/lens-speech$ext" "speech-bin/lens-speech-gpu$ext"
            fi
          fi
          # Without arguments it prints its usage and fails: proof that it starts.
          out=$("speech-bin/lens-speech$ext" 2>&1 || true)
          [[ "$out" == *usage* ]]
          # No AVX-512: most CPUs lack it, and the speech would crash there (illegal instruction).
          if [[ "${{ matrix.speech }}" == x86_64-unknown-linux-gnu ]]; then
            for program in speech-bin/*; do
              if objdump -d "$program" | grep -q zmm; then echo "$program uses AVX-512"; exit 1; fi
            done
          fi

      - name: Smoke test
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/lens
          [[ "$RUNNER_OS" == "Windows" ]] && bin="$bin.exe"
          "$bin" version
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            # Static: no dynamic section means no glibc or library dependency.
            ! readelf -d "$bin" | grep -q NEEDED
          fi

      # Signing runs only where the publisher's secrets exist; nothing pretends otherwise.
      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS' && env.CAN_SIGN_APPLE == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # Notarization with the App Store Connect API key, as the installers do.
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "" "$keychain"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$keychain"
          bin=target/${{ matrix.target }}/release/lens
          mkdir -p "$RUNNER_TEMP/notarize"
          for program in "$bin" speech-bin/*; do
            codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$program"
            cp "$program" "$RUNNER_TEMP/notarize/"
          done
          ditto -c -k "$RUNNER_TEMP/notarize" "$RUNNER_TEMP/notarize.zip"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Package
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          name="sirv-lens-$version-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp README.md "dist/$name/"
          cp speech-bin/* "dist/$name/"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp target/${{ matrix.target }}/release/lens.exe target/${{ matrix.target }}/release/lensw.exe "dist/$name/"
            (cd dist && 7z a -tzip "$name.zip" "$name" >/dev/null)
          else
            cp target/${{ matrix.target }}/release/lens "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          fi
          rm -rf "dist/$name"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # Friendly installers, one per platform: Sirv Lens.app in a DMG, a per-user setup program, and
  # an AppImage, a .deb and an Arch package. Each runs the first run when opened (lens open).
  # They package the binary job's programs (signed, glibc floor checked, same speech GPU backend)
  # and the extension job's store build: nothing compiles twice.
  installers:
    name: installers ${{ matrix.os }}
    needs: [binary, extension]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CAN_SIGN_APPLE: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, formats: "app,dmg", target: aarch64-apple-darwin }
          - { os: macos-15-intel, formats: "app,dmg", target: x86_64-apple-darwin }
          - { os: windows-2025, formats: nsis, target: x86_64-pc-windows-msvc }
          # Linux packages carry the static musl Lens.
          - { os: ubuntu-24.04, formats: "appimage,deb,pacman", target: x86_64-unknown-linux-musl }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # scripts/package.mjs reads `cargo metadata` and runs `cargo packager`.
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: cargo-bins/cargo-binstall@851112458b5f28a29e5bc14a690c3f283d9dcc6f # v1.26.2
        with:
          version: 1.26.2
      # A prebuilt, signature-checked packager; binstall compiles it only when none exists.
      - name: Packager
        run: cargo binstall cargo-packager@0.11.8 --locked --no-confirm
      - name: Tools (Linux)
        if: runner.os == 'Linux'
        # linuxdeploy looks for the speech programs' Vulkan library here.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvulkan1 libfuse2 file
      - name: Tools (Windows)
        if: runner.os == 'Windows'
        run: choco install nsis -y --no-progress
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binary-${{ matrix.target }}
          path: artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension
          path: artifacts
      - name: The built programs and extensions where package.mjs looks
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          name="sirv-lens-$version-${{ matrix.target }}"
          python=python3; [[ "$RUNNER_OS" == "Windows" ]] && python=python
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            "$python" -m zipfile -e "artifacts/$name.zip" artifacts
          else
            tar -C artifacts -xzf "artifacts/$name.tar.gz"
          fi
          release="target/${{ matrix.target }}/release"
          mkdir -p "$release"
          find "artifacts/$name" -type f ! -name README.md -exec cp -p {} "$release/" \;
          ls -l "$release"
          for browser in chrome firefox; do
            "$python" -m zipfile -e "artifacts/sirv-lens-extension-$version-$browser.zip" "extension/.output/$browser-mv3"
          done
      # A released Mac installer is always signed and notarized: the download page says so.
      - name: Signing and notarization are set up (macOS release)
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID != '' }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER != '' }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 != '' }}
        run: |
          missing=""
          for name in APPLE_SIGNING_IDENTITY APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_API_KEY_P8; do
            [[ "${!name}" == true ]] || missing="$missing $name"
          done
          if [[ -n "$missing" ]]; then
            echo "::error::Missing secrets:$missing. A release must not ship unsigned or un-notarized Mac installers."
            exit 1
          fi
      - name: Signing keychain (macOS)
        if: runner.os == 'macOS' && env.CAN_SIGN_APPLE == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "" "$keychain"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$keychain"
      - name: Build the installers
        shell: bash
        env:
          # Signing, and notarization of the app and the DMG with an App Store Connect API key.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [[ "$RUNNER_OS" == "macOS" && -n "$APPLE_API_KEY_P8" ]]; then
            export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
            printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH"
          fi
          unset APPLE_API_KEY_P8
          node scripts/package.mjs --formats "${{ matrix.formats }}" --target "${{ matrix.target }}" --skip-build
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          # The installers' speech programs: no AVX-512 either (see the Speech programs step).
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            for program in $(find target -path '*release/lens-speech' -type f); do
              if objdump -d "$program" | grep -q zmm; then echo "$program uses AVX-512"; exit 1; fi
            done
            # Ubuntu 22.04, Debian 12 and RHEL 9 run every program in the packages.
            sh scripts/glibc-floor.sh 2.34 dist/*.deb dist/*.AppImage dist/*-pacman.tar.gz
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*-setup.exe
            dist/*.AppImage
            dist/*.deb
            dist/*-pacman.tar.gz
          if-no-files-found: error

  extension:
    needs: versions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: extension/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml
      - name: Store packages (Chrome, and Firefox with its source archive for AMO review)
        working-directory: extension
        run: |
          pnpm install --frozen-lockfile
          pnpm compile
          pnpm test
          pnpm zip
          pnpm zip:firefox
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension
          path: extension/.output/*.zip
          # .output starts with a dot, and upload-artifact skips hidden folders unless told.
          include-hidden-files: true
          if-no-files-found: error

  publish:
    needs: [binary, installers, extension]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Every installed copy takes this release: only a commit already on main ships.
      - name: The tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true
      - name: Installers and checksums
        run: |
          cp scripts/install.sh scripts/install.ps1 release/
          cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Signed update manifest
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        working-directory: release
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign
          version="${GITHUB_REF_NAME#v}"
          # Installed copies refuse a feed older than one they already saw (src/update.rs).
          released_at=$(date -u +%s)
          python3 - "$version" "$released_at" <<'PY'
          import json, re, sys
          version, released_at = sys.argv[1], int(sys.argv[2])
          sums = dict(reversed(line.split(maxsplit=1)) for line in open("SHA256SUMS").read().splitlines())
          sums = {name.lstrip("*"): digest for name, digest in sums.items()}
          v = re.escape(version)
          assets, installers = {}, {}
          for name, digest in sums.items():
              # Target triples only: the Arch package (…-linux-x86_64-pacman.tar.gz) is not one.
              found = re.fullmatch(rf"sirv-lens-{v}-(\w+-(?:apple|unknown|pc)-[\w-]+)\.(tar\.gz|zip)", name)
              if found:
                  assets[found.group(1)] = {"file": name, "sha256": digest}
              # The macOS app and the AppImage update as a whole, from their installers.
              found = re.fullmatch(rf"Sirv-Lens-{v}-(macos-arm64|macos-x64)\.dmg|Sirv-Lens-{v}-(linux-x86_64)\.AppImage", name)
              if found:
                  installers[found.group(1) or found.group(2)] = {"file": name, "sha256": digest}
          extension = f"sirv-lens-extension-{version}-chrome.zip"
          manifest = {"version": version, "released_at": released_at, "assets": assets, "installers": installers,
                      "extension": {"file": extension, "sha256": sums[extension]} if extension in sums else None}
          assert len(assets) == 5, f"expected five platform archives, found {sorted(assets)}"
          assert len(installers) == 3, f"expected three installers, found {sorted(installers)}"
          json.dump(manifest, open("latest.json", "w"), indent=2)
          PY
          key="$RUNNER_TEMP/minisign.key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          # The trusted comment is signed too: Lens checks that it names this version and time.
          minisign -S -s "$key" -m latest.json -t "Sirv Lens $version version=$version timestamp=$released_at"
          rm -f "$key"
          minisign -V -P RWRUIk1sA/LfACfTQLljdyJArqZHzXbSZB32dsXEr2AMUrXAmSXevoDr -m latest.json \
            | grep -F "version=$version timestamp=$released_at"
          sha256sum latest.json latest.json.minisig >> SHA256SUMS
      # Published at once: installed copies read releases/latest, which skips drafts.
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --latest --verify-tag --generate-notes release/*
