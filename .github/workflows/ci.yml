name: CI

on:
  push:
    branches: [next, main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Third-party actions are pinned to a commit; the comment records the tag. Move both together.
jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: libclang for bindgen (Windows)
        # .cargo/config.toml makes whisper-rs-sys use its bundled bindings, made on Linux, so
        # building needs no libclang. Their struct sizes are wrong on Windows (long is 32 bits
        # there): Windows generates its own with the runner's LLVM.
        if: runner.os == 'Windows'
        shell: bash
        run: |
          test -f "/c/Program Files/LLVM/bin/libclang.dll"
          echo 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"
          sed -i '/WHISPER_DONT_GENERATE_BINDINGS/d' .cargo/config.toml
          cargo clean -p whisper-rs-sys

      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test (also regenerates the TypeScript protocol)
        run: cargo test --locked
      - name: Speech program (whisper.cpp, CPU build)
        run: |
          cargo clippy -p lens-speech --all-targets --locked -- -D warnings
          cargo test -p lens-speech --locked
      - name: The committed TypeScript protocol matches the Rust types
        shell: bash
        run: git diff --exit-code -- extension/src/protocol
      - name: Build the binary for the end-to-end test
        run: cargo build --locked

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: extension/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml
      - name: Extension
        working-directory: extension
        run: |
          pnpm install --frozen-lockfile
          pnpm compile
          pnpm test
          pnpm build
          pnpm build:firefox
      - name: Chromium for the end-to-end test
        working-directory: extension
        run: pnpm exec playwright-core install chromium
      - name: End to end (Chromium, extension, shim, daemon, fixture site)
        working-directory: extension
        env:
          LENS_E2E: '1'
          LENS_BIN: ${{ github.workspace }}/target/debug/lens${{ runner.os == 'Windows' && '.exe' || '' }}
          E2E_SHOTS: ${{ runner.temp }}/e2e-shots
        run: |
          pnpm build
          pnpm test:e2e
      - name: Screenshots of a failed end-to-end run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-shots-${{ matrix.os }}
          path: ${{ runner.temp }}/e2e-shots
          if-no-files-found: ignore

  installer:
    name: installer ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build
        run: cargo build --locked
      - name: A local release folder, served over HTTP
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "LENS_VERSION=$version" >> "$GITHUB_ENV"
          case "$RUNNER_OS" in
            Linux) target=x86_64-unknown-linux-musl ;;
            macOS) target=aarch64-apple-darwin ;;
            Windows) target=x86_64-pc-windows-msvc ;;
          esac
          name="sirv-lens-$version-$target"
          mkdir -p "release/$name"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp target/debug/lens.exe target/debug/lensw.exe "release/$name/"
            (cd release && 7z a -tzip "$name.zip" "$name" >/dev/null)
          else
            cp target/debug/lens "release/$name/"
            tar -C release -czf "release/$name.tar.gz" "$name"
          fi
          rm -rf "release/$name"
          (cd release && sha256sum * > SHA256SUMS)
          (cd release && python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 2
      - name: install.sh (macOS, Linux)
        if: runner.os != 'Windows'
        env:
          LENS_DOWNLOAD_BASE: http://127.0.0.1:8765
        run: |
          home=$(mktemp -d)
          mkdir -p "$home/.config/chromium" "$home/Library/Application Support/Chromium"
          HOME="$home" XDG_CONFIG_HOME="$home/.config" LENS_HOME="$home/lens" LENS_BIN_DIR="$home/bin" \
            sh scripts/install.sh "$LENS_VERSION"
          test -x "$home/bin/lens"
          ls "$home"/.config/chromium/NativeMessagingHosts/studio.sirv.lens.json \
            "$home/Library/Application Support/Chromium/NativeMessagingHosts/studio.sirv.lens.json" 2>/dev/null | grep -q .
      - name: install.ps1 under PowerShell 7 and Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          LENS_DOWNLOAD_BASE: http://127.0.0.1:8765
        run: |
          foreach ($shell in 'pwsh', 'powershell') {
            & $shell -NoProfile -ExecutionPolicy Bypass -File scripts/install.ps1
            if ($LASTEXITCODE -ne 0) { throw "install.ps1 failed under $shell" }
            $exe = Join-Path $env:LOCALAPPDATA 'Programs\Sirv Lens\lens.exe'
            if (-not (Test-Path $exe)) { throw "lens.exe is missing after $shell" }
            $key = 'HKCU:\Software\Google\Chrome\NativeMessagingHosts\studio.sirv.lens'
            if (-not (Test-Path $key)) { throw "the Chrome registration is missing after $shell" }
            & $exe service uninstall
            & $exe stop
            & $exe unregister
            if (Test-Path $key) { throw 'lens unregister left the Chrome registration' }
          }

  service:
    name: service ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build lens and lensw
        run: cargo build --locked
      - name: Install, stop, start, restart, uninstall
        shell: bash
        run: |
          set -x
          lens=target/debug/lens
          [[ "$RUNNER_OS" == "Windows" ]] && lens=target/debug/lens.exe
          wait_for() { for _ in $(seq 50); do "$lens" status | grep -q "daemon           $1" && return; sleep 0.2; done; "$lens" status; return 1; }
          "$lens" service install
          "$lens" status | grep "service          starts at login"
          wait_for running
          "$lens" stop
          wait_for stopped
          sleep 3   # a service manager that restarted a clean exit would bring it back here
          wait_for stopped
          "$lens" start
          wait_for running
          "$lens" restart
          wait_for running
          "$lens" service uninstall
          "$lens" status | grep "service          not installed"
          "$lens" stop

  update:
    name: update round trip
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build
        run: cargo build --locked
      - name: A signed feed one version ahead, then update a running install
        run: |
          set -x
          sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign
          work=$(mktemp -d)
          export LENS_HOME="$work/lens"
          mkdir -p "$work/bin" "$work/feed/sirv-lens-9.9.9-x86_64-unknown-linux-musl"
          cp target/debug/lens "$work/bin/lens"
          cp target/debug/lens "$work/feed/sirv-lens-9.9.9-x86_64-unknown-linux-musl/lens"
          printf 'new build' >> "$work/feed/sirv-lens-9.9.9-x86_64-unknown-linux-musl/lens"
          tar -C "$work/feed" -czf "$work/feed/sirv-lens-9.9.9-x86_64-unknown-linux-musl.tar.gz" sirv-lens-9.9.9-x86_64-unknown-linux-musl
          sha=$(sha256sum "$work/feed/sirv-lens-9.9.9-x86_64-unknown-linux-musl.tar.gz" | cut -d' ' -f1)
          printf '{"version":"9.9.9","assets":{"x86_64-unknown-linux-musl":{"file":"sirv-lens-9.9.9-x86_64-unknown-linux-musl.tar.gz","sha256":"%s"}},"extension":null}' "$sha" > "$work/feed/latest.json"
          minisign -G -W -p "$work/test.pub" -s "$work/test.key"
          minisign -S -s "$work/test.key" -m "$work/feed/latest.json"
          (cd "$work/feed" && python3 -m http.server 8766 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 1
          export LENS_UPDATE_FEED=http://127.0.0.1:8766 LENS_UPDATE_PUBLIC_KEY=$(sed -n 2p "$work/test.pub")
          "$work/bin/lens" start
          "$work/bin/lens" update --check | grep "9.9.9 is available"
          before=$(sha256sum "$work/bin/lens")
          "$work/bin/lens" update | grep "9.9.9 is installed"
          test "$(sha256sum "$work/bin/lens")" != "$before"
          tail -c 9 "$work/bin/lens" | grep -q "new build"
          "$work/bin/lens" status | grep "daemon           running"
          # A changed manifest no longer matches its signature: refused, nothing installed.
          sed -i 's/9.9.9/9.9.10/' "$work/feed/latest.json"
          ! "$work/bin/lens" update 2>&1
          "$work/bin/lens" update 2>&1 | grep "not signed by the Lens release key" || true
          "$work/bin/lens" stop

  update-windows:
    name: update round trip windows
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build
        run: cargo build --locked
      - name: A signed feed one version ahead, then update a running install
        run: |
          set -x
          work=$(mktemp -d)
          curl -fsSL -o "$work/minisign.zip" https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-win64.zip
          echo "37b600344e20c19314b2e82813db2bfdcc408b77b876f7727889dbd46d539479  $work/minisign.zip" | sha256sum -c -
          7z x -o"$work/minisign" "$work/minisign.zip" >/dev/null
          minisign="$work/minisign/minisign-win64/x86_64/minisign.exe"
          export LENS_HOME="$(cygpath -w "$work/lens")"
          name=sirv-lens-9.9.9-x86_64-pc-windows-msvc
          mkdir -p "$work/bin" "$work/feed/$name"
          cp target/debug/lens.exe target/debug/lensw.exe "$work/bin/"
          cp target/debug/lens.exe target/debug/lensw.exe "$work/feed/$name/"
          printf 'new build' >> "$work/feed/$name/lens.exe"
          printf 'new build' >> "$work/feed/$name/lensw.exe"
          (cd "$work/feed" && 7z a -tzip "$name.zip" "$name" >/dev/null)
          sha=$(sha256sum "$work/feed/$name.zip" | cut -d' ' -f1)
          printf '{"version":"9.9.9","assets":{"x86_64-pc-windows-msvc":{"file":"%s.zip","sha256":"%s"}},"extension":null}' "$name" "$sha" > "$work/feed/latest.json"
          "$minisign" -G -W -p "$work/test.pub" -s "$work/test.key"
          "$minisign" -S -s "$work/test.key" -m "$work/feed/latest.json"
          (cd "$work/feed" && python -m http.server 8766 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 2
          export LENS_UPDATE_FEED=http://127.0.0.1:8766 LENS_UPDATE_PUBLIC_KEY=$(sed -n 2p "$work/test.pub" | tr -d '\r')
          "$work/bin/lens.exe" start
          "$work/bin/lens.exe" status | grep "daemon           running"
          "$work/bin/lens.exe" update --check | grep "9.9.9 is available"
          "$work/bin/lens.exe" update | grep "9.9.9 is installed"
          tail -c 9 "$work/bin/lens.exe" | grep -q "new build"
          tail -c 9 "$work/bin/lensw.exe" | grep -q "new build"
          # The running daemon was renamed aside and restarted from the new file.
          sleep 3
          "$work/bin/lens.exe" status | grep "daemon           running"
          "$work/bin/lens.exe" stop
