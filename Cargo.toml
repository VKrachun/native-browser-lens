[workspace]
members = [".", "speech"]

[package]
name = "lens"
version = "0.12.26"
edition = "2024"

[dependencies]
base64 = "0.23.1"
directories = "6.0.0"
flate2 = "1.1.11"
image-webp = "0.2.4"
interprocess = "2.4.8"
keyring = "4.2.0"
minisign-verify = "0.3.0"
rmcp = { version = "3.10.0", features = ["server", "transport-io"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd", "png-format"] }
tokio = { version = "1.54.1", features = ["rt", "macros", "io-std"] }
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
ureq = "3"
url = "2.5.8"
tiny_http = "0.12.0"
tempfile = "3.27.0"
uuid = { version = "1.29.2", features = ["v4", "v5"] }
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[target."cfg(windows)".dependencies]
widestring = "1.2.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Threading"] }
winreg = "0.56.0"

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tao = "0.37.2"
tray-icon = "0.26.1"


[profile.release]
lto = true
codegen-units = 1
strip = true
